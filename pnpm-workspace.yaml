packages:
  - bot
  - packs/*
  - tools/*

# Keep the whole protocol stack on one minecraft-data version (PLAN.md section 7).
overrides:
  minecraft-data: 3.117.0

# Install (build) scripts are blocked by default. None are needed:
# - raknet-native ships prebuilt binaries (prebuilds/win32-10-x64, linux-5-x64, darwin-21-x64); its
#   install script only falls back to a cmake build when the prebuild fails to load.
# - raknet-node is an optional backend of bedrock-protocol that we never select.
# Denying them explicitly keeps `pnpm install` quiet and deterministic.
allowBuilds:
  raknet-native: false
  raknet-node: false
  # esbuild (packs/truth bundler) loads its platform binary from the @esbuild/* optional
  # dependency; its postinstall is only a check.
  esbuild: false

# bedrock-protocol 3.60.1 depends on prismarine-xbox-services through a pinned git commit
# (PrismarineJS/prismarine-xbox-services#052a967...). pnpm blocks git subdependencies by default.
blockExoticSubdeps: false

# Game versions newer than the npm minecraft-data release (PLAN.md task 1.5). The patch adds
# bedrock 1.26.60 (protocol 2225) to minecraft-data 3.117.0; generated by
# tools/bump-version/make-patch.mjs 1.26.60 (see tools/bump-version/playbook.md step 4).
# Delete the entry and the patch in the same change as the minecraft-data bump that ships 1.26.60:
# pnpm refuses unused patch entries.
patchedDependencies:
  minecraft-data@3.117.0: patches/minecraft-data@3.117.0.patch
  # Realms: a regional NetherNet signalling host can exist in DNS and still answer 404 on the
  # websocket path (signal-southcentralus, 2026-10-29); upstream #839 only checks DNS. The patch
  # falls back to the default host once and reports the HTTP status. Applies to the git pin in bot
  # and to npm 3.60.1 in packs/tools (same file). Drop when upstream ships the fallback.
  bedrock-protocol: patches/bedrock-protocol.patch

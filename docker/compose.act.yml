# BDS for the interaction e2e tests (PLAN.md Phase 7 task 7.3, Track O: placing blocks and using
# doors, gates, trapdoors, buttons, levers). Same settings as compose.wood.yml (offline, RakNet, flat,
# peaceful, operator, TICK_DISTANCE 10), own name, port and data dir. scripts/bds.mjs has no `act`
# profile (its profile table is fixed), so by hand:
#   docker compose -f docker/compose.act.yml up -d
#   pnpm --filter @bedrockbot/truth-pack pack:deploy --data ../../docker/data/act --world act --restart bds-act
name: bedrockbot-act

services:
  bds-act:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-act
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      DIFFICULTY: peaceful
      LEVEL_TYPE: FLAT
      LEVEL_NAME: act
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-act
      SERVER_PORT: "19158"
      TICK_DISTANCE: "10"
    ports:
      - "19158:19158/udp"
    volumes:
      - ./data/act:/data
    stdin_open: true
    tty: true

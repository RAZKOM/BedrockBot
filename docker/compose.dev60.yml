# Local dev BDS 1.26.60.6 over RakNet: the next game version, run beside bds-dev (PLAN.md task 1.5).
# Same settings as compose.dev.yml except container name, port, version and data dir, so the whole
# e2e suite can run against it:
#   node scripts/bds.mjs up --profile dev60          (or: docker compose -f docker/compose.dev60.yml up -d)
#   node scripts/bds.mjs pack --profile dev60        (deploy the truth pack and restart)
#   pnpm e2e:60                                      (e2e suite with BOT_VERSION=1.26.60 against bds60)
# The bot speaks 1.26.60 only with patches/minecraft-data@3.117.0.patch applied (pnpm install does it).
name: bedrockbot-dev60

services:
  bds60:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds60
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      # 26.60 prints a "TRANSPORT TYPE ERROR" banner for raknet but still accepts RakNet clients.
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "${BDS_IDLE_TIMEOUT:-0}"
      ALLOW_CHEATS: "true"
      DIFFICULTY: "${BDS_DIFFICULTY:-peaceful}"
      LEVEL_TYPE: FLAT
      LEVEL_NAME: dev
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds60
      SERVER_PORT: "19134"
      # BDS also binds an IPv6 port (default 19133); keep it away from other containers' ports.
      SERVER_PORT_V6: "19135"
    ports:
      - "19134:19134/udp"
    volumes:
      - ./data/dev60:/data
    stdin_open: true
    tty: true

# Local dev BDS over NetherNet (WebRTC), the BDS default since 26.50 and the only Realm transport.
# Weekly test profile (PLAN.md task 1.4). Mutually exclusive with compose.dev.yml: both use the
# container name bds-dev so `pnpm bds:cmd` works with either, and docker refuses to run both at once.
#   docker compose -f docker/compose.dev-nethernet.yml up -d
# Clients: createClient({ transport: 'nethernet', nethernet: { signalling: 'lan' }, port: 19140 })
name: bedrockbot-dev-nethernet

services:
  bds-dev:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-dev
    environment:
      EULA: "TRUE"
      VERSION: "1.26.51.1"
      TRANSPORT: nethernet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      LEVEL_TYPE: FLAT
      LEVEL_NAME: dev
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-dev
      SERVER_PORT: "19140"
      SERVER_UDP_PORTS: "19140"
    ports:
      - "19140:19140/tcp"
      - "19140:19140/udp"
      # NetherNet LAN discovery
      - "7551:7551/udp"
    volumes:
      - ./data/dev-nethernet:/data
    stdin_open: true
    tty: true

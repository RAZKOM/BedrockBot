# BDS for the Elytra flight e2e tests (wave 11, Track AU; docs/flight.md). Like compose.dig.yml: a
# FLAT world, difficulty peaceful, operator, own project name, container bds-fly on udp/19204, data in
# docker/data/fly (seeded from docker/data/dig without its `worlds/` and `server.properties`, so the
# server generated its own flat world and BDS was not downloaded again). Fall damage stays ON in this
# container: the landing damage is what the suites measure (they may set doDaylightCycle false).
#   node scripts/bds.mjs --profile fly up
#   node scripts/bds.mjs --profile fly pack      # truth pack (needed by the fly-* e2e tests)
name: bedrockbot-fly

services:
  bds-fly:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-fly
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      DIFFICULTY: peaceful
      LEVEL_TYPE: FLAT
      LEVEL_NAME: fly
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-fly
      SERVER_PORT: "19204"
      TICK_DISTANCE: "10"
    ports:
      - "19204:19204/udp"
    volumes:
      - ./data/fly:/data
    stdin_open: true
    tty: true

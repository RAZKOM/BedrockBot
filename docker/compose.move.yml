# Movement / pathfinding BDS (PLAN.md Phase 3 tasks 3.3 to 3.6, Track D). Same settings as bds-dev /
# bds-phys (offline, RakNet, flat, peaceful, operator), own name, port and data dir so the nav e2e
# tests never share a server with other tracks.
#   docker compose -f docker/compose.move.yml up -d
#   pnpm --filter @bedrockbot/truth-pack pack:deploy --data ../../docker/data/move --world move --restart bds-move
name: bedrockbot-move

services:
  bds-move:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-move
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      DIFFICULTY: peaceful
      LEVEL_TYPE: FLAT
      LEVEL_NAME: move
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-move
      SERVER_PORT: "19146"
      # Chunks within tick-distance of a player stay loaded for scripts, so truth:fill can build the
      # 100-block nav courses without teleporting along them (default 4).
      TICK_DISTANCE: "10"
    ports:
      - "19146:19146/udp"
    volumes:
      - ./data/move:/data
    stdin_open: true
    tty: true

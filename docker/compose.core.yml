# BDS for the process manager and runtime settings e2e tests (PLAN.md tasks 7.8 and 7.9, Track Q;
# docs/processes.md). Same settings as compose.pve.yml (flat, difficulty NORMAL, TICK_DISTANCE 10)
# with its own project name, container bds-core on udp/19180, data in docker/data/core. The core-*
# suites (and the hard-* / pve-* regression runs pointed at it with CORE_BDS_*-style env) use it.
#   node scripts/bds.mjs --profile core up
#   node scripts/bds.mjs --profile core pack         # truth pack (needed by the core-* e2e tests)
#   node scripts/bds.mjs --profile core cmd summon zombie 10 -60 10
name: bedrockbot-core

services:
  bds-core:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-core
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      DIFFICULTY: "${BDS_CORE_DIFFICULTY:-normal}"
      LEVEL_TYPE: FLAT
      LEVEL_NAME: core
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-core
      SERVER_PORT: "19180"
      TICK_DISTANCE: "10"
    ports:
      - "19180:19180/udp"
    volumes:
      - ./data/core:/data
    stdin_open: true
    tty: true

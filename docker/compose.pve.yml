# BDS for the PvE / follow e2e tests (PLAN.md tasks 7.4, 7.5, 7.6; docs/pve.md). Same settings as
# compose.hard.yml but on difficulty NORMAL (the Realm's), own project name, container bds-pve on
# udp/19144, data in docker/data/pve. The tests switch natural spawning off (`gamerule
# domobspawning false`) and summon mobs explicitly, except the opt-in "survive a night" run.
#   node scripts/bds.mjs --profile pve up
#   node scripts/bds.mjs --profile pve pack          # truth pack (needed by the pve-* e2e tests)
#   node scripts/bds.mjs --profile pve cmd summon zombie 10 -60 10
name: bedrockbot-pve

services:
  bds-pve:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-pve
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      DIFFICULTY: "${BDS_PVE_DIFFICULTY:-normal}"
      LEVEL_TYPE: FLAT
      LEVEL_NAME: pve
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-pve
      SERVER_PORT: "19144"
      TICK_DISTANCE: "10"
    ports:
      - "19144:19144/udp"
    volumes:
      - ./data/pve:/data
    stdin_open: true
    tty: true

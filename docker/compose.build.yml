# BDS for the builder e2e tests (wave 9, Track AL; docs/build.md). Made from compose.get.yml (offline,
# RakNet, operator, TICK_DISTANCE 10, own project name) on a FLAT world so every test builds on a known
# floor (grass top at y -61, feet at -60). Peaceful, container bds-build on udp/19200, data in
# docker/data/build (seeded from an existing data folder without worlds/ and server.properties).
#   node scripts/bds.mjs --profile build up
#   node scripts/bds.mjs --profile build pack        # truth pack (needed by the build-* e2e tests)
name: bedrockbot-build

services:
  bds-build:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-build
    environment:
      EULA: "TRUE"
      VERSION: "1.26.60.6"
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      PLAYER_IDLE_TIMEOUT: "0"
      ALLOW_CHEATS: "true"
      DIFFICULTY: peaceful
      LEVEL_TYPE: FLAT
      LEVEL_NAME: build
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-build
      SERVER_PORT: "19200"
      TICK_DISTANCE: "10"
    ports:
      - "19200:19200/udp"
    volumes:
      - ./data/build:/data
    stdin_open: true
    tty: true

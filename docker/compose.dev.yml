# Local dev BDS over RakNet (PLAN.md task 0.2). Offline, flat world, no allow-list.
# Use via the root scripts: pnpm bds:up | pnpm bds:down | pnpm bds:cmd say hi
name: bedrockbot-dev

services:
  bds-dev:
    image: itzg/minecraft-bedrock-server:2026.10.2
    container_name: bds-dev
    environment:
      EULA: "TRUE"
      # Must equal the bot's default game version (1.26.60 since 2026-10-28, through the minecraft-data
      # patch -> 1.26.60; docs/versions.md); full 4-part build. Rollback: docker/compose.dev51.yml.
      VERSION: "1.26.60.6"
      # The image defaults to NetherNet since 2026.10.0; RakNet clients time out without this.
      # 26.60 prints a "TRANSPORT TYPE ERROR" banner for raknet but still accepts RakNet clients.
      TRANSPORT: raknet
      ONLINE_MODE: "false"
      # allow-list=true together with online-mode=false makes BDS exit at startup.
      ALLOW_LIST: "false"
      # Minutes before an idle player is kicked; 0 = never. Overridable for the keepalive soak:
      #   BDS_IDLE_TIMEOUT=1 pnpm bds:up   (then plain `pnpm bds:up` again to restore 0)
      PLAYER_IDLE_TIMEOUT: "${BDS_IDLE_TIMEOUT:-0}"
      ALLOW_CHEATS: "true"
      # Peaceful: hostile mobs killed the standing AFK bot at night on easy, which turns keepalive
      # tests into respawn tests. Override with BDS_DIFFICULTY=easy|normal|hard.
      DIFFICULTY: "${BDS_DIFFICULTY:-peaceful}"
      LEVEL_TYPE: FLAT
      LEVEL_NAME: dev
      DEFAULT_PLAYER_PERMISSION_LEVEL: operator
      SERVER_NAME: bds-dev
      SERVER_PORT: "19132"
    ports:
      - "19132:19132/udp"
    volumes:
      # Server files, worlds and logs (git-ignored). The truth pack is deployed into this folder by
      # `pnpm pack:deploy` (packs/truth, task 0.4).
      - ./data/dev:/data
    stdin_open: true
    tty: true
